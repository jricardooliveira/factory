# Model-tier policy — the single source of truth for which model each agent runs on.
#
# Read by factory.agent_config.tiers. Tiers are ROLES: the strongest model for
# planning and design, a coding model for implementation, an independent family for
# review, a cheap model for summaries. A failed attempt by an agent listed under
# [escalate_on_retry] re-runs on that tier: a retry is exactly the case where the
# first model already proved insufficient.
#
# Each agent's <name>.md frontmatter repeats its `model_tier:` and the tier's `model:`
# (the fallback for a hand-run `opencode run`). `factory evals` and
# tests/agent_config/test_tiers.py fail if the two drift — change both together.
#
# Re-point a tier without editing this file: FACTORY_TIER_<TIER>=provider/model
# (e.g. FACTORY_TIER_BUILD=openai/gpt-6.1-sol-fast). `factory doctor` probes every distinct
# model below before a run spends tokens on a spec and an architect call.

# Tier used for any agent not listed under [agents].
default_tier = "standard"

# Tier -> concrete opencode model id (provider/model). Operator decision (2026-10-02):
# the latest OpenAI models (GPT-6 Astra / Sol / Luna, through the ChatGPT/Codex login)
# and Anthropic models (Opus / Sonnet / Haiku, with Fable for special cases), the
# latter through Requesty (`requesty/*`; `anthropic/*` is not a configured provider).
# `factory doctor` probes every model here before a run spends anything.
#
# The rule behind the mapping: a REVIEWER never shares a model family with the
# AUTHORS it reviews (two models of one family tend to share blind spots), and a
# failed attempt is retried by the strongest model of the other family.
[tiers]
frontier = "openai/gpt-6-astra"         # OpenAI's top model: the hardest reasoning
build = "openai/gpt-6.1-sol"            # "complex coding at lower cost"
notes = "openai/gpt-6-luna"             # fast, cheap: summaries
review = "requesty/claude-opus-5-5"     # independent review of OpenAI-written code
check = "requesty/claude-sonnet-5-5"    # independent boundary review of the design
special = "requesty/claude-fable-5.1"   # special cases: a failed attempt, retried
standard = "requesty/claude-haiku-4-5"  # fallback for any agent not listed below

# Agent -> tier on its first attempt.
[agents]
spec-agent = "frontier"        # planning / decomposition — "is this the right work?"
architect-agent = "frontier"   # design trade-offs, risk, ADRs
coder-agent = "build"          # implementation — highest call volume
boundary-agent = "check"       # pre-implementation tenant / authz / API / security review
tester-agent = "review"        # QA / security / performance review (≈ PR review)
release-agent = "notes"        # release notes — summarising evidence, deciding nothing

# Agent -> tier on attempt 2+. A failed attempt is the special case: it needs more
# reasoning AND a different perspective than the model that just failed.
[escalate_on_retry]
coder-agent = "special"

# Model -> public API list price, USD per 1M tokens. The $10-per-story cap
# (domain/gates.MAX_STORY_COST_USD) estimates spend from recorded tokens at these
# prices when the provider reports none (a ChatGPT/Codex login reports $0; Requesty
# reports its real charge, which wins). Sources, 2026-10-02: OpenAI's pricing page
# and GPT-6 announcement (Astra $10/$50, Sol $2/$10, Luna $0.10/$0.50; Fast mode =
# 2.5x) and opencode's model metadata for the Requesty-routed models. Every tier's
# model needs a price, or its calls count as "unknown usage" against the cap.
[prices."openai/gpt-6-astra"]
input = 10.0
output = 50.0

[prices."openai/gpt-6.1-sol"]
input = 2.0
output = 10.0

[prices."openai/gpt-6-luna"]
input = 0.1
output = 0.5

[prices."requesty/claude-opus-5-5"]
input = 4.0
output = 20.0

[prices."requesty/claude-sonnet-5-5"]
input = 2.0
output = 10.0

[prices."requesty/claude-haiku-4-5"]
input = 1.0
output = 5.0

[prices."requesty/claude-fable-5.1"]
input = 10.0
output = 50.0

# The previous defaults: kept so spend already recorded under them is still priced.
[prices."openai/gpt-5.5"]
input = 5.0
output = 30.0

[prices."openai/gpt-5.5-fast"]
input = 12.5
output = 75.0
