# The eval pass-rate as a merge check (AI-Native SDLC playbook, Stage 4:
# "a pass-rate threshold gated as a merge check").
#
# It runs on the GitHub remote (origin). Whether a merge REQUIRES it is a branch-
# protection setting on GitHub, which this file cannot prove. The gate it encodes:
# a change to the AGENT CONFIGURATION (agents/*.md, agents/policies/REVIEW.md,
# src/factory/domain/{gates,ambiguity}.py, src/factory/agent_config/, prompt assembly
# in src/factory/pipeline/) must not land without the eval suite passing at 100%.
#
# Everything below is offline and costs zero tokens — no opencode call, no API key.
name: check

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # A weekly re-run of the OFFLINE suite on a fresh runner. It does NOT measure model
    # drift: replays feed frozen agent outputs, so a worse model answer is invisible
    # here. Live behavioural evals are not built (improvement-tasks T09).
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workspace.git.collect_repo_diff / _factory_baseline walk history; a shallow
          # clone would silently change what the diff-measurement tests see.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      # verification/typescript.py shells out to tsc; the runner ships node, not tsc.
      - name: Install TypeScript
        run: npm install -g typescript@5

      - name: Unit + orchestration tests
        run: uv run python -m pytest -q

      - name: Scenario matrix (offline, no tokens)
        run: uv run factory simulate

      - name: Agent-configuration evals (gates the merge at 100%)
        run: uv run factory evals --report eval-report.md

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
          if-no-files-found: ignore
