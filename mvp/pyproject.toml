[project]
name = "factory-mvp"
version = "0.1.0"
description = "Minimal 3-agent software factory pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=0.4,<1",
    "sqlalchemy>=2.0,<3",
    "rich>=13,<16",
    "pydantic>=2,<3",
    "textual>=0.60",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src/factory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# Only the factory's own suite. Generated project code lives under projects/*/repo
# and must never be collected into the factory's tests.
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
