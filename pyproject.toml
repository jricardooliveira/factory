[project]
name = "factory-mvp"
version = "0.1.0"
description = "AI software factory: governed spec -> design -> build -> verify pipeline"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4,<1",
    "rich>=13,<16",
    "pydantic>=2,<3",
    "textual>=0.60",
]

[project.scripts]
factory = "factory.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships non-Python package data too, e.g. evidence/schemas/trust-package.schema.json,
# which the trust package validates against at run time.
packages = ["src/factory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# Only the factory's own suite. Generated project code lives under projects/*/repo
# and must never be collected into the factory's tests.
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
